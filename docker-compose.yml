# device-mcp auf Coolify: Server (MCP, Panel, Daemon-WebSocket) und Postgres.
# Coolify setzt die Domain auf den Service "server" (Port 3000), Traefik reicht auch WebSockets durch.
# Lokal: docker compose -f docker-compose.yml -f compose.local.yml up -d --build
services:
  server:
    build:
      context: .
      dockerfile: server/Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgres://${POSTGRES_USER:-devicemcp}:${POSTGRES_PASSWORD:?}@postgres:5432/${POSTGRES_DB:-devicemcp}
      PUBLIC_URL: ${PUBLIC_URL:?}
      MCP_TOKEN: ${MCP_TOKEN:?}
      PANEL_PASSWORD: ${PANEL_PASSWORD:?}
      SESSION_TTL_HOURS: ${SESSION_TTL_HOURS:-168}
      SESSION_MAX_DAYS: ${SESSION_MAX_DAYS:-30}
      HEARTBEAT_INTERVAL_SECONDS: ${HEARTBEAT_INTERVAL_SECONDS:-15}
      HEARTBEAT_TIMEOUT_SECONDS: ${HEARTBEAT_TIMEOUT_SECONDS:-45}
      TRUST_PROXY: ${TRUST_PROXY:-1}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    expose:
      - "3000"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-devicemcp}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
      POSTGRES_DB: ${POSTGRES_DB:-devicemcp}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
